<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ShopKR</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --primary:#1D6FE0; --primary-dark:#1656B3;
    --red:#E8402C; --gold:#FFB400; --green:#1CA362;
    --text:#1B1B1E; --text-2:#6B6E75; --text-3:#A3A6AC; --border:#E7E8EC;
    --radius:10px;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; font-family:var(--font); color:var(--text);}
  body{background:#DDE1E6; display:flex; justify-content:center; align-items:center; min-height:100vh;}
  button{font-family:inherit;}

  /* Phone frame on desktop; full screen on phones */
  #phone{width:390px; height:min(844px, calc(100vh - 48px)); background:var(--bg); border:8px solid #111;
    border-radius:40px; overflow:hidden; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.25);}
  @media (max-width:500px){
    body{display:block; background:var(--bg);}
    #phone{width:100%; height:100vh; height:100dvh; border:0; border-radius:0; box-shadow:none;}
  }
  #app{display:flex; flex-direction:column; height:100%; position:relative; overflow:hidden;}

  /* Header */
  #topbar{background:var(--primary); color:#fff; padding:10px 14px 12px; flex-shrink:0;}
  #topbar-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px;}
  #logo{font-weight:800; font-size:19px; letter-spacing:-.4px; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none; cursor:pointer; padding:4px 0; min-height:32px; display:flex; align-items:center;}
  #logo .kr{color:var(--gold);}
  .lang-toggle{background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.45); color:#fff; font-size:12px;
    font-weight:700; padding:7px 11px; border-radius:16px; cursor:pointer; min-height:32px;}
  #search-bar{background:#fff; border-radius:20px; padding:10px 14px; display:flex; align-items:center; gap:8px;
    color:var(--text-3); font-size:14px; cursor:text; min-height:40px;}

  /* Content */
  #content{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; position:relative;}
  #content::-webkit-scrollbar{width:0;}
  .section-title{font-size:15px; font-weight:800; margin:18px 14px 10px; display:flex; justify-content:space-between; align-items:center;}
  .banner{margin:12px 14px 4px; border-radius:14px; padding:18px; background:linear-gradient(135deg,#1D6FE0,#4A90FF);
    color:#fff; position:relative; overflow:hidden;}
  .banner h2{margin:0 0 4px; font-size:18px; font-weight:800; max-width:72%; position:relative; z-index:1;}
  .banner p{position:relative; z-index:1;}
  #topbar.compact #search-bar{display:none;}
  #topbar.compact #topbar-row{margin-bottom:0;}
  .banner p{margin:0; font-size:12.5px; opacity:.92;}
  .banner svg{position:absolute; right:10px; bottom:6px; opacity:.28;}

  .cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px 6px; padding:6px 14px;}
  .cat-tile{display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; background:none; border:0; padding:0; color:var(--text);}
  .cat-tile .icon{width:54px; height:54px; border-radius:16px; background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .cat-tile .label{font-size:10.5px; text-align:center; line-height:1.25; font-weight:600;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 14px 10px;}
  .list{display:flex; flex-direction:column; gap:10px; padding:8px 14px 14px;}
  .card{background:var(--surface); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; cursor:pointer;
    text-align:left; padding:0; color:var(--text); font:inherit; width:100%;}
  .card:active{transform:scale(.985);}
  .card .thumb{aspect-ratio:1/1; display:block; width:100%;}
  .card .thumb svg{width:100%; height:100%; display:block;}
  .card .info{padding:9px 10px 11px;}
  .card.row{display:flex; gap:10px; padding:10px;}
  .card.row .thumb{width:96px; height:96px; flex-shrink:0; border-radius:8px; overflow:hidden; aspect-ratio:auto;}
  .card.row .info{padding:0; flex:1; min-width:0;}
  .brand{font-size:10.5px; color:var(--text-3); font-weight:700; margin-bottom:2px;}
  .pname{font-size:12.5px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-bottom:5px; min-height:34px;}
  .price-row{display:flex; align-items:baseline; gap:5px; flex-wrap:wrap;}
  .disc{font-size:13px; color:var(--red); font-weight:800;}
  .price{font-size:15px; font-weight:800;}
  .list-price{font-size:11px; color:var(--text-3); text-decoration:line-through;}
  .unit-price{font-size:10.5px; color:var(--text-2); margin-top:2px;}
  .meta-row{display:flex; align-items:center; gap:4px; margin-top:4px; font-size:11px; color:var(--text-2);}
  .star{color:var(--gold);}
  .badges{display:flex; gap:4px; margin-top:5px; flex-wrap:wrap;}
  .badge{font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px;}
  .badge.fast{background:#EAF2FF; color:var(--primary);}
  .badge.free{background:#EAFBF3; color:var(--green);}

  /* Search screen */
  .search-row{display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--primary);}
  .search-row input{flex:1; border:0; border-radius:20px; padding:10px 14px; font-size:15px; outline:none; font-family:inherit; min-height:40px;}
  .icon-btn{background:none; border:0; color:#fff; font-size:22px; cursor:pointer; min-width:36px; min-height:40px;}
  .chip-row{display:flex; gap:7px; padding:10px 14px 4px; overflow-x:auto;}
  .chip-row::-webkit-scrollbar{height:0;}
  .chip{background:#fff; border:1px solid var(--border); border-radius:16px; padding:8px 13px; font-size:12px; cursor:pointer;
    font-weight:600; color:var(--text-2); white-space:nowrap; min-height:34px;}
  .chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .result-count{padding:8px 14px 0; font-size:12px; color:var(--text-2);}
  .empty{padding:60px 30px; text-align:center; color:var(--text-3); font-size:13px;}

  /* Product detail */
  .pd-header{display:flex; align-items:center; gap:6px; padding:6px 8px; background:#fff; border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:2;}
  .pd-header .icon-btn{color:var(--text);}
  .pd-header .title{font-weight:700; font-size:13.5px;}
  .pd-image svg{width:100%; height:auto; display:block;}
  .pd-body{padding:16px; background:#fff;}
  .pd-name{font-size:16px; font-weight:700; margin:4px 0 4px; line-height:1.4;}
  .pd-size{font-size:12.5px; color:var(--text-2); margin-bottom:10px;}
  .pd-price-row{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .pd-disc{font-size:22px; font-weight:800; color:var(--red);}
  .pd-price{font-size:22px; font-weight:800;}
  .pd-ship{font-size:12.5px; margin-top:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .divider{height:8px; background:var(--bg);}
  .reviews-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px 6px; background:#fff;}
  .review{padding:12px 16px; border-bottom:1px solid #F1F2F4; background:#fff;}
  .review-top{display:flex; align-items:center; gap:6px; margin-bottom:4px; font-size:11.5px;}
  .review-author{font-weight:700; color:var(--text-2);}
  .review-date{color:var(--text-3);}
  .review-text{font-size:13px; line-height:1.5;}
  .link-btn{background:none; border:0; padding:6px 0 0; color:var(--primary); font-size:11.5px; font-weight:700; cursor:pointer;}
  .review-helpful{font-size:10.5px; color:var(--text-3); margin-top:4px;}

  /* Footer */
  .site-footer{margin-top:14px; padding:18px 16px 24px; border-top:1px solid var(--border); color:var(--text-3); font-size:10.5px; line-height:1.8;}
  .site-footer b{color:var(--text-2); font-size:11.5px;}

  /* Bottom nav */
  #bottomnav{display:flex; border-top:1px solid var(--border); background:#fff; flex-shrink:0; padding-bottom:env(safe-area-inset-bottom);}
  .nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 9px; cursor:pointer;
    color:var(--text-3); font-size:10.5px; font-weight:600; background:none; border:0; min-height:52px;}
  .nav-item.active{color:var(--primary);}
  .nav-item svg{width:22px; height:22px;}

  .toast{position:absolute; bottom:76px; left:50%; transform:translateX(-50%); background:rgba(20,20,22,.92); color:#fff;
    padding:10px 18px; border-radius:20px; font-size:12.5px; z-index:60; font-weight:600; white-space:nowrap;}

  /* Researcher panel (hidden; opened by long-pressing the logo) */
  #rp{position:absolute; inset:0; background:#fff; z-index:80; display:flex; flex-direction:column; transform:translateY(100%);
    transition:transform .22s ease; font-size:12.5px;}
  #rp.open{transform:translateY(0);}
  .rp-head{background:#111; color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0;}
  .rp-head h3{margin:0; font-size:14px;}
  .rp-head .ver{font-size:10.5px; opacity:.6; margin-left:6px; font-weight:600;}
  .rp-close{background:none; border:0; color:#fff; font-size:20px; cursor:pointer; min-width:36px; min-height:36px;}
  .rp-tabs{display:flex; border-bottom:1px solid var(--border); flex-shrink:0;}
  .rp-tab{flex:1; background:none; border:0; border-bottom:2px solid transparent; padding:11px 4px; font-size:12px; font-weight:700;
    color:var(--text-2); cursor:pointer;}
  .rp-tab.active{color:var(--primary); border-bottom-color:var(--primary);}
  .rp-body{flex:1; overflow-y:auto; padding:12px 14px 24px;}
  .rp-kv{display:grid; grid-template-columns:110px 1fr; gap:6px 10px; margin-bottom:12px;}
  .rp-kv dt{color:var(--text-2); font-weight:600;}
  .rp-kv dd{margin:0; font-weight:700; word-break:break-all;}
  .rp-btn{background:var(--primary); color:#fff; border:0; padding:10px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; min-height:38px;}
  .rp-btn.sec{background:#F0F2F5; color:var(--text);}
  .rp-btn.danger{background:#FDECEA; color:var(--red);}
  .rp-btns{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .rp-btns .rp-btn{flex:1; min-width:120px;}
  .rp-note{font-size:11px; color:var(--text-2); line-height:1.5; margin:6px 0 12px;}
  .rp-presets{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .rp-preset{border:1px solid var(--border); background:#fff; border-radius:14px; padding:7px 11px; font-size:11.5px; font-weight:700; cursor:pointer;}
  .rp-preset.active{background:#111; color:#fff; border-color:#111;}
  .rp-count{display:inline-block; background:#EAF2FF; color:var(--primary); font-size:11px; font-weight:800; padding:2px 8px; border-radius:10px;}
  .rp-stage{font-size:10.5px; font-weight:800; color:var(--text-3); text-transform:uppercase; letter-spacing:.4px; margin:14px 0 4px;}
  .rp-pat{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #F2F2F4;}
  .rp-pat .n{width:22px; height:22px; border-radius:50%; background:#E7E8EC; color:var(--text-2); font-size:10.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .rp-pat.on .n{background:var(--red); color:#fff;}
  .rp-pat .txt{flex:1; min-width:0;}
  .rp-pat .nm{font-weight:700; font-size:12px;}
  .rp-pat .sub{font-size:10.5px; color:var(--text-3); margin-top:2px;}
  .switch{position:relative; width:38px; height:22px; flex-shrink:0;}
  .switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; z-index:1;}
  .switch .track{position:absolute; inset:0; background:#D3D5DA; border-radius:20px; transition:.15s;}
  .switch .track:before{content:''; position:absolute; width:18px; height:18px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.15s;}
  .switch input:checked + .track{background:var(--red);}
  .switch input:checked + .track:before{transform:translateX(16px);}
  .rp-log-item{padding:7px 0; border-bottom:1px solid #F2F2F4; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10.5px; color:var(--text-2); word-break:break-all;}
  .rp-log-item b{color:var(--text);}
  .rp-cl{border-bottom:1px solid var(--border); padding:10px 0;}
  .rp-cl h4{margin:0 0 4px; font-size:12.5px;}
  .rp-cl h4 span{font-weight:500; color:var(--text-3); font-size:11px; margin-left:4px;}
  .rp-cl ul{margin:4px 0 0; padding-left:16px;}
  .rp-cl li{font-size:11.5px; color:var(--text-2); line-height:1.5; margin-bottom:3px;}
  table.rp-matrix{border-collapse:collapse; width:100%; font-size:10.5px; margin-top:6px;}
  table.rp-matrix th, table.rp-matrix td{border:1px solid var(--border); padding:4px; text-align:center;}
  table.rp-matrix td.l{text-align:left;}

  /* ---------- Phase 2: storefront ---------- */
  #topbar.hidden{display:none;}
  .chev{color:var(--text-3); font-size:18px; margin-left:6px;}
  .badge.ad{background:#F0F2F5; color:var(--text-2); font-weight:700;}
  .badge.plain{background:#F0F2F5; color:var(--text-2);}
  .member-banner{display:flex; align-items:center; gap:12px; width:calc(100% - 28px); margin:10px 14px 0; padding:12px 14px;
    background:#1B1B1E; color:#fff; border:0; border-radius:14px; cursor:pointer; font-size:13px; min-height:56px;}
  .mb-icon{width:34px; height:34px; border-radius:10px; background:var(--gold); color:#1B1B1E; font-weight:900; font-size:20px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .mb-sub{font-size:11px; opacity:.75;}
  .member-banner .chev{color:#fff; opacity:.6;}
  .sub-header{display:flex; align-items:center; gap:4px; padding:4px 8px; background:#fff; border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:3; min-height:48px;}
  .sub-header .title{font-weight:700; font-size:14.5px;}
  .icon-btn.dark{color:var(--text);}
  .sort-row, .filter-row{display:flex; gap:6px; padding:8px 14px 0; overflow-x:auto;}
  .sort-row::-webkit-scrollbar, .filter-row::-webkit-scrollbar{height:0;}
  .sort-chip{font-size:12px; padding:8px 11px; border-radius:14px; border:1px solid var(--border); background:#fff; white-space:nowrap;
    cursor:pointer; font-weight:600; color:var(--text-2); min-height:34px;}
  .sort-chip.active{background:var(--text); color:#fff; border-color:var(--text);}
  .filter-chip{font-size:12px; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:#fff; white-space:nowrap;
    cursor:pointer; font-weight:600; color:var(--text-2); min-height:34px;}
  .filter-chip.active{border-color:var(--primary); color:var(--primary); background:#EAF2FF;}
  .pd-gallery{position:relative; background:#fff;}
  .pd-gallery svg{width:100%; height:auto; display:block;}
  .dots{position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:6px;}
  .dot{width:7px; height:7px; border-radius:50%; background:rgba(0,0,0,.2);}
  .dot.on{background:var(--text); width:16px; border-radius:4px;}
  .pd-section{background:#fff; padding:14px 16px;}
  .pd-section-title{font-weight:800; font-size:14px; margin-bottom:10px;}
  .info-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .info-table th{text-align:left; color:var(--text-2); font-weight:600; width:34%; padding:7px 0; vertical-align:top; border-top:1px solid #F1F2F4;}
  .info-table td{padding:7px 0; border-top:1px solid #F1F2F4;}
  .terms{margin-top:12px; font-size:12.5px; line-height:1.55; color:var(--text);}   /* TODO(phase 3): hiddenTerms shrinks/greys this */
  .terms-title{font-weight:700; margin-bottom:4px;}
  .review-sort{font-size:12.5px; border:1px solid var(--border); border-radius:8px; padding:7px 8px; background:#fff; color:var(--text); min-height:34px; font-family:inherit;}
  .page-title{font-size:18px; font-weight:800; padding:16px 16px 6px;}
  .panel{background:#fff; margin:10px 14px 0; border-radius:12px; border:1px solid var(--border); padding:14px;}
  .panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:13.5px; gap:10px;}
  .cart-item{display:flex; gap:12px; padding:14px; border-bottom:1px solid #F1F2F4;}
  .cart-item:last-child{border-bottom:0;}
  .cart-thumb{width:72px; height:72px; border-radius:8px; overflow:hidden; flex-shrink:0; border:0; padding:0; background:none; cursor:pointer;}
  .cart-thumb svg{display:block;}
  .cart-controls{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
  .qty{display:flex; align-items:center; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .qty button{width:36px; height:34px; border:0; background:#fff; font-size:16px; cursor:pointer; color:var(--text);}
  .qty button:disabled{color:var(--text-3); cursor:default;}
  .qty span{min-width:30px; text-align:center; font-weight:700; font-size:13px;}
  .text-btn{background:none; border:0; color:var(--text-2); font-size:12.5px; font-weight:600; cursor:pointer; padding:8px 4px; min-height:34px;}
  .text-btn.primary{color:var(--primary); font-weight:700;}
  .sum-row{display:flex; justify-content:space-between; font-size:13px; color:var(--text-2); padding:4px 0; gap:10px;}
  .sum-row.total{color:var(--text); font-weight:800; font-size:15.5px; border-top:1px solid var(--border); margin-top:6px; padding-top:10px;}
  .minus{color:var(--red);}
  .free-txt{color:var(--green); font-weight:700;}
  .sum-note{font-size:11.5px; color:var(--green); font-weight:600; padding:0 0 4px;}
  .hint{font-size:11.5px; color:var(--text-2); line-height:1.5; margin-top:8px;}
  .btn{display:block; width:100%; border:0; border-radius:10px; padding:13px 12px; font-size:14.5px; font-weight:700; cursor:pointer; min-height:48px; font-family:inherit;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-sec{background:#F0F2F5; color:var(--text);}
  .btn-outline{background:#fff; color:var(--primary); border:1.5px solid var(--primary);}
  .btn-danger{background:var(--red); color:#fff;}
  #bottomnav.action-bar{display:flex; gap:8px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); background:#fff;}
  #bottomnav.action-bar .btn{flex:1;}
  .addr-label{font-weight:700; font-size:13.5px;}
  .addr-line{font-size:12.5px; color:var(--text-2); line-height:1.5;}
  .addr-card{cursor:default;}
  .addr-card[role="button"]{cursor:pointer;}
  .addr-card.current{border-color:var(--primary); background:#F5F9FF;}
  .arrival{color:var(--green); font-weight:700; font-size:12px; text-align:right;}
  .co-item{display:flex; align-items:center; gap:10px; padding:6px 0;}
  .co-thumb{width:44px; height:44px; border-radius:6px; overflow:hidden; flex-shrink:0;}
  .co-thumb svg{display:block;}
  .co-name{display:block; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .co-meta{display:block; font-size:11.5px; color:var(--text-2); margin-top:2px;}
  .opt{display:flex; gap:10px; align-items:flex-start; padding:9px 0; font-size:13px; cursor:pointer; border-top:1px solid #F1F2F4;}
  .opt:first-of-type{border-top:0;}
  .opt input{width:20px; height:20px; margin:1px 0 0; accent-color:var(--primary); flex-shrink:0;}
  .opt-sub{display:block; font-size:11.5px; color:var(--text-2); line-height:1.45; margin-top:2px; font-weight:400;}
  .paycard{display:flex; align-items:center; gap:12px; padding:10px; border:1px solid var(--border); border-radius:10px; font-size:13px;}
  .paycard.selected{border-color:var(--primary); background:#F5F9FF;}
  .card-chip{width:52px; height:34px; border-radius:6px; background:linear-gradient(135deg,#1F4FA8,#3B7BE0); color:#fff; font-size:9.5px;
    font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .radio{width:20px; height:20px; border-radius:50%; border:2px solid var(--text-3); flex-shrink:0; position:relative;}
  .radio.on{border-color:var(--primary);}
  .radio.on:after{content:''; position:absolute; inset:3px; border-radius:50%; background:var(--primary);}
  .done{padding:36px 18px 24px; text-align:center;}
  .done-title{font-size:19px; font-weight:800; margin-top:8px;}
  .profile{display:flex; align-items:center; gap:12px; font-size:14px;}
  .avatar{width:44px; height:44px; border-radius:50%; background:#F0F2F5; color:var(--text-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

/* The active design: ?design=<id> on the link, otherwise CONFIG.ACTIVE_DESIGN. */
const DESIGN_ID = (() => {
  try { const q = new URLSearchParams(location.search).get('design'); if (q && CONFIG.DESIGNS[q]) return q; } catch(e){}
  return CONFIG.ACTIVE_DESIGN;
})();
CONFIG.DESIGN = Object.assign({id: DESIGN_ID}, CONFIG.DESIGNS[DESIGN_ID]);
function memberCfg(k){ return !!(CONFIG.DESIGN.membership || {})[k]; }
function paidMembership(){ return (CONFIG.DESIGN.membership || {}).model === 'paid'; }

/* Design cells: one cell per combination of factor levels.
   Code = factor letter + level, e.g. A1B0 = factor A on, factor B off. */
function buildCells(design){
  const f = design.factors, n = f.length, out = {};
  f.forEach(x => x.patterns.forEach(k => { if (!PATTERN_KEYS.includes(k)) throw new Error('CONFIG.DESIGNS: unknown pattern ' + k); }));
  for (let m = 0; m < (1 << n); m++){
    const lv = f.map((_, i) => (m >> (n - 1 - i)) & 1);
    const code = f.map((_, i) => 'ABCDEFGH'.charAt(i) + lv[i]).join('');
    out[code] = {
      levels: Object.fromEntries(f.map((x, i) => [x.key, lv[i]])),
      patterns: [...new Set(f.flatMap((x, i) => lv[i] ? x.patterns : []))],
    };
  }
  return out;
}
Object.values(CONFIG.DESIGNS).forEach(d => Object.entries(buildCells(d)).forEach(([code, c]) => { CONFIG.PRESETS[code] = c.patterns; }));
const DESIGN_CELLS = buildCells(CONFIG.DESIGN);
CONFIG.ASSIGNABLE_CONDITIONS = Object.keys(DESIGN_CELLS);
function cellLevels(code){ return DESIGN_CELLS[code] ? DESIGN_CELLS[code].levels : Object.fromEntries(CONFIG.DESIGN.factors.map(x => [x.key, null])); }

function flagsForPreset(code){
  const on = new Set(CONFIG.PRESETS[code] || []);
  return Object.fromEntries(PATTERN_KEYS.map(k => [k, on.has(k)]));
}
function dp(key){ return !!(state.flags && state.flags[key]); }
function flagSnapshot(){ return {...state.flags}; }
function activeKeys(){ return PATTERN_KEYS.filter(k => state.flags[k]); }

function productReviews(p){
  const pool = REVIEW_POOLS[p.cat] || [];
  return [0,1,2,3,4].map(k => {
    const idx = (p.id + k * 3) % pool.length;
    const rv = pool[idx];
    return {...rv, idx, days: rv.d + (p.id % 3), author: REVIEWER_NAMES[(p.id * 5 + k) % REVIEWER_NAMES.length]};
  });
}

/* ============================== HELPERS ============================== */
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(n){ const v = Math.round(n).toLocaleString('en-US'); return state.lang === 'ko' ? v + '원' : '₩' + v; }
function starRow(r){ const full = Math.round(r); return '★'.repeat(full) + '☆'.repeat(5 - full); }
// falseDiscount: every item gets an inflated reference price (~38% above the sale price).
function dispList(p){ return dp('falseDiscount') ? Math.max(p.list, Math.ceil(p.price * 1.38 / 100) * 100) : p.list; }
function discountPct(p){ const l = dispList(p); return l > p.price ? Math.round((1 - p.price / l) * 100) : 0; }
function sizeText(p){ return dp('priceComparisonPrevention') && ALT_SIZES[p.id] ? ALT_SIZES[p.id] : p.size; }
// fakeLowStock: ~35% of products claim 1–3 left, regardless of real stock (deterministic per session).
function lowStockN(p){ return dp('fakeLowStock') && seeded('ls' + p.id) < 0.35 ? 1 + Math.floor(seeded('lsn' + p.id) * 3) : 0; }
function socialNums(p){ return {v: 24 + Math.floor(seeded('sv' + p.id) * 170), b: 11 + Math.floor(seeded('sb' + p.id) * 90), card: seeded('sc' + p.id) < 0.4}; }
// data-dp marks an element whose first visibility is logged as a dark_pattern_impression.
function dpAttr(keys, item){
  const on = keys.filter(dp);
  if (!on.length) return '';
  const nums = on.map(k => PATTERNS.find(p => p.key === k).n).join(' · ');
  return ` data-dp="${on.join(' ')}" data-dp-item="${item == null ? '' : item}" data-dp-n="${nums}"`;
}
function unitPriceText(p){
  if (dp('priceComparisonPrevention')) return '';
  const u = p.unit; if (!u || !u.amt) return '';
  const v = p.price / u.amt * u.per;
  const basis = (u.per === 1 ? '1' : u.per) + u.m;
  return state.lang === 'ko'
    ? `(${basis}당 ${Math.round(v).toLocaleString('en-US')}원)`
    : `(${fmt(v)} ${t('per')} ${basis})`;
}

// Safe localStorage wrapper (private browsing or blocked storage must not break the app).
const store = {
  get(k){ try { const v = localStorage.getItem(CONFIG.STORAGE_PREFIX + k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(k, v){ if (!state.study || !state.study.consented) return false;   // nothing is stored before consent
    try { localStorage.setItem(CONFIG.STORAGE_PREFIX + k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(CONFIG.STORAGE_PREFIX + k); } catch(e){} },
  // Ungated access, used only to finish sending queues of EARLIER (already consented) sessions,
  // which must keep working while the current participant is still on the consent screen.
  rawSet(k, v){ try { localStorage.setItem(CONFIG.STORAGE_PREFIX + k, JSON.stringify(v)); return true; } catch(e){ return false; } },
};
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => b[i] = Math.random() * 256 | 0);
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
function randomIndex(n){
  if (window.crypto && crypto.getRandomValues){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  return Math.floor(Math.random() * n);
}
// Deterministic per-session randomness for participant-visible numbers (used from Phase 3).
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(key){
  let a = hashStr((state.session ? state.session.sessionId : '') + '|' + key);
  a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a);
  x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296;
}

/* ============================== SESSION ==============================
   A session is identified by a random sessionId kept in localStorage, so a
   refresh resumes the same session. A link with a different pid or cond
   than the stored session starts a new one. */
function initSession(){
  const qs = new URLSearchParams(location.search);
  const urlPid = (qs.get('pid') || '').trim().slice(0, 64) || null;
  const rawCond = (qs.get('cond') || '').trim();
  const urlCond = rawCond && Object.prototype.hasOwnProperty.call(CONFIG.PRESETS, rawCond) ? rawCond : null;
  const stored = store.get('session');
  const matches = stored && stored.sessionId && stored.design === CONFIG.DESIGN.id &&
    (!urlPid || urlPid === stored.pid) && (!urlCond || urlCond === stored.condAssigned);

  if (matches){
    state.session = stored;
    state.flags = store.get('flags.' + stored.sessionId) || flagsForPreset(stored.cond in CONFIG.PRESETS ? stored.cond : stored.condAssigned);
    state.logs = store.get('log.' + stored.sessionId) || [];
    state.lang = store.get('lang.' + stored.sessionId) || CONFIG.DEFAULT_LANG;
    state.study = Object.assign({phase:'shopping', consented:true}, store.get('study.' + stored.sessionId) || {});
    state.study.consented = true;   // a stored session only exists after consent
    state.queue = store.get('queue.' + stored.sessionId) || [];
    state.seq = Math.max(Number(store.get('seq.' + stored.sessionId)) || 0, ...state.logs.map(e => e.seq || 0), ...state.queue.map(e => e.seq || 0), 0);
    loadShop();
    log('session_resume', {dpConfig: flagSnapshot(), queuedEvents: state.queue.length});
  } else {
    startNewSession(urlPid, urlCond, rawCond && !urlCond ? rawCond : null);
  }
}
function startNewSession(pid, cond, invalidCond){
  // A link with a valid ?cond= is pinned to that condition. Otherwise the cell is assigned
  // after consent (runAssignment), so people who decline never take up a slot.
  const assignedBy = cond ? 'url' : 'pending';
  cond = cond || null;
  clearTimeout(logSaveTimer);   // a save still pending belongs to the previous session (already saved by the caller)
  // Held in memory only: nothing is stored or logged until the participant consents.
  state.session = {design: CONFIG.DESIGN.id, sessionId: uuid(), pid: pid || null, condAssigned: cond, cond, assignedBy, invalidCondParam: invalidCond || null, startedAt: new Date().toISOString()};
  state.flags = flagsForPreset(cond);
  state.logs = []; state.queue = []; state.seq = 0; state.seenImp = {};
  state.lang = CONFIG.DEFAULT_LANG;
  state.study = {phase:'consent', consented:false, consentAt:null, taskStartAt:null, taskEnd:null, withdrawn:false};
  state.reveal = false;
  resetShop();
}
function saveStudy(){ if (state.session) store.set('study.' + state.session.sessionId, state.study); }
function persistSession(){
  store.set('session', state.session);
  store.set('flags.' + state.session.sessionId, state.flags);
  store.set('lang.' + state.session.sessionId, state.lang);
}

/* ============================== LOGGING ==============================
   Every event: {seq, t, iso, elapsedMs (since consent), sessionId, pid, cond, appVersion,
   screen, phase, type, detail}. detail is always an object. Each event is kept in the
   local log (backup/export) and in a persistent send queue until the server confirms it. */
let logSaveTimer = null;
const SEND_NOW = new Set(['consent_given', 'session_start', 'order_placed', 'task_end', 'study_complete', 'withdrawal', 'membership_join', 'membership_cancel']);
function log(type, detail){
  if (!state.study.consented) return;   // nothing is logged before consent
  if (state.study.withdrawn && type !== 'withdrawal') return;   // nothing is logged after withdrawal
  const s = state.session || {};
  const consentT = state.study.consentAt ? Date.parse(state.study.consentAt) : null;
  const now = Date.now();
  state.seq += 1;
  const ev = {
    seq: state.seq,
    t: now, iso: new Date(now).toISOString(), elapsedMs: consentT ? now - consentT : null,
    sessionId: s.sessionId || null, pid: s.pid || null, cond: s.cond || null,
    appVersion: CONFIG.APP_VERSION, screen: state.screen, phase: state.study.phase,
    type, detail: (detail && typeof detail === 'object') ? detail : {},
  };
  state.logs.push(ev);
  state.queue.push(ev);
  clearTimeout(logSaveTimer);
  logSaveTimer = setTimeout(saveLogs, 400);
  if (SEND_NOW.has(type)) setTimeout(() => flushQueue('event:' + type), 0);
  if (state.rpOpen && (state.rpTab === 'log' || state.rpTab === 'session')) renderResearcherPanel();
}
function saveLogs(){
  if (!state.session) return;
  store.set('log.' + state.session.sessionId, state.logs);
  saveQueue();
}
function saveQueue(){
  if (!state.session) return;
  store.set('queue.' + state.session.sessionId, state.queue);
  store.set('seq.' + state.session.sessionId, state.seq);
  // Last-known summary, so a queue left behind by this session can still be sent later.
  if (state.study.consented) store.set('summary.' + state.session.sessionId, sessionSummary());
}

/* ============================ SERVER SYNC ============================
   POST as text/plain (a "simple" request, so no CORS preflight) to the Apps Script
   web app. The server answers {ok, maxSeq}; events up to maxSeq leave the queue.
   Failures back off 5 s → 10 s → … → 60 s. When the page is hidden the remaining
   queue is also sent with sendBeacon; the server ignores any seq it already has. */
const SYNC = {inFlight: false, lastOkAt: null, lastError: null, failures: 0, nextAt: 0, sentTotal: 0};
const SEND_TIMEOUT_MS = 30000;   // a request that hangs is abandoned (and retried) instead of blocking sending
async function postJSON(url, body, timeoutMs){
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), timeoutMs || SEND_TIMEOUT_MS) : null;
  try {
    const res = await fetch(url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body, redirect: 'follow', signal: ctl ? ctl.signal : undefined});
    const j = await res.json();
    if (!j || !j.ok) throw new Error((j && j.error) || ('HTTP ' + res.status));
    return j;
  } finally { if (timer) clearTimeout(timer); }
}
function endpoint(){
  let dev = '';
  try { dev = localStorage.getItem(CONFIG.STORAGE_PREFIX + 'device.endpoint') || ''; } catch(e){}
  return (dev || CONFIG.ENDPOINT_URL || '').trim();
}
function toRow(e){
  return {eventId: e.sessionId + '-' + e.seq, sessionId: e.sessionId, pid: e.pid, cond: e.cond, appVersion: e.appVersion,
    seq: e.seq, ts: e.iso, elapsedMs: e.elapsedMs, phase: e.phase, screen: e.screen, type: e.type,
    pattern: (e.detail && e.detail.pattern) || '', detail: JSON.stringify(e.detail || {})};
}
function sessionSummary(){
  const s = state.session, st = state.study, last = state.orders[0];
  // A withdrawn session reports only that it was withdrawn: no ID, condition or outcomes.
  if (st.withdrawn) return {sessionId: s.sessionId, withdrawn: true, appVersion: CONFIG.APP_VERSION};
  const started = st.taskStartAt ? Date.parse(st.taskStartAt) : null, ended = st.taskEnd ? Date.parse(st.taskEnd.at) : null;
  const seen = PATTERN_KEYS.filter(k => patternSeen(k));
  return {
    sessionId: s.sessionId, pid: s.pid, condAssigned: s.condAssigned, condFinal: s.cond, assignedBy: s.assignedBy,
    appVersion: CONFIG.APP_VERSION, lang: state.lang, consentAt: st.consentAt, taskStartAt: st.taskStartAt,
    taskEndAt: st.taskEnd ? st.taskEnd.at : null, taskEndReason: st.taskEnd ? st.taskEnd.reason : null,
    taskDurationMs: started && ended ? ended - started : null, orderCount: state.orders.length,
    lastOrderTotal: last ? last.totals.total : null, overBudget: totalSpent() > CONFIG.BUDGET,
    protectionKept: last ? last.protection : null, trialKept: last ? last.trial : null,
    membershipFees: state.memberFees, totalSpent: totalSpent(), joinedVia: state.nag.joinedVia,
    nagShown: state.nag.shows, nagDeclines: state.nag.declines, nagEscaped: state.nag.escapes > 0, gatePrompts: state.nag.gatePrompts,
    memberBenefit: memberBenefit(), joinedAgainstInterest: state.memberFees > 0 ? state.memberFees > memberBenefit() : null,
    membershipActive: state.membership.active, marketingEmail: !!state.prefs.mkEmail,
    design: CONFIG.DESIGN.id, ...cellLevels(s.condAssigned),
    patternsOn: activeKeys().join(' '), patternsSeen: seen.join(' '), phase: st.phase, withdrawn: !!st.withdrawn,
    completionCode: st.phase === 'complete' ? completionCode() : null, userAgent: navigator.userAgent,
  };
}
// Everything paid today: orders plus membership fees (the task budget covers both).
function totalSpent(){ return state.orders.reduce((s, o) => s + o.totals.total, 0) + (state.memberFees || 0); }
function memberBenefit(){ return state.orders.reduce((s, o) => s + ((o.memberSavings && o.memberSavings.total) || 0), 0); }
function buildPayload(batch){ return {v: 1, session: sessionSummary(), events: batch.map(toRow), withdraw: !!state.study.withdrawn}; }
async function flushQueue(reason){
  const url = endpoint();
  if (!url || SYNC.inFlight || !state.study.consented || !state.session) return;
  if (!state.queue.length) return;
  if (Date.now() < SYNC.nextAt && reason !== 'manual') return;
  const sid = state.session.sessionId;
  const batch = state.queue.slice(0, CONFIG.SYNC_BATCH_MAX);
  const body = JSON.stringify(buildPayload(batch));
  SYNC.inFlight = true;
  try {
    const j = await postJSON(url, body);
    const confirmed = Math.max(Number(j.maxSeq) || 0, batch[batch.length - 1].seq);
    if (state.session && state.session.sessionId === sid){
      state.queue = state.queue.filter(e => e.seq > confirmed);
      saveQueue();
    } else {
      trimStoredQueue(sid, confirmed);   // a new session started while this request was in flight
    }
    SYNC.lastOkAt = Date.now(); SYNC.failures = 0; SYNC.lastError = null; SYNC.nextAt = 0; SYNC.sentTotal += batch.length;
  } catch (err){
    SYNC.failures += 1;
    SYNC.lastError = String((err && err.message) || err);
    SYNC.nextAt = Date.now() + Math.min(60000, CONFIG.SYNC_INTERVAL_MS * Math.pow(2, SYNC.failures - 1));
  } finally {
    SYNC.inFlight = false;
    if (state.rpOpen && state.rpTab === 'session') renderResearcherPanel();
  }
  if (state.queue.length && !SYNC.failures) setTimeout(() => flushQueue('drain'), 250);
}
/* Queues left behind by earlier sessions on this device (a lab phone reused for the next
   participant while offline, or "New session" before everything was sent) are sent from
   localStorage with that session's last stored summary. */
const ORPHANS = {inFlight: false, pending: 0};
function storedQueueSids(){
  const cur = state.session && state.session.sessionId, out = [];
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i) || '';
      if (k.startsWith(CONFIG.STORAGE_PREFIX + 'queue.')){
        const sid = k.slice((CONFIG.STORAGE_PREFIX + 'queue.').length);
        if (sid && sid !== cur) out.push(sid);
      }
    }
  } catch(e){}
  return out;
}
function trimStoredQueue(sid, confirmed){
  const rest = (store.get('queue.' + sid) || []).filter(e => e.seq > confirmed);
  if (rest.length) store.rawSet('queue.' + sid, rest);
  else { store.del('queue.' + sid); store.del('summary.' + sid); }
}
async function drainOrphanQueues(){
  const url = endpoint();
  const sids = storedQueueSids();
  ORPHANS.pending = sids.reduce((n, sid) => n + (store.get('queue.' + sid) || []).length, 0);
  if (!url || ORPHANS.inFlight || !sids.length) return;
  ORPHANS.inFlight = true;
  try {
    for (const sid of sids){
      // Each earlier session is sent on its own: one that fails never blocks the others.
      try {
        const q = store.get('queue.' + sid) || [];
        if (!q.length){ store.del('queue.' + sid); store.del('summary.' + sid); continue; }
        const summary = Object.assign({}, store.get('summary.' + sid) || {}, {sessionId: sid});
        const batch = q.slice(0, CONFIG.SYNC_BATCH_MAX);
        const j = await postJSON(url, JSON.stringify({v: 1, session: summary, events: batch.map(toRow), withdraw: !!summary.withdrawn}));
        trimStoredQueue(sid, Math.max(Number(j.maxSeq) || 0, batch[batch.length - 1].seq));
      } catch(e){ /* this session is retried on the next interval */ }
    }
  } finally {
    ORPHANS.inFlight = false;
    ORPHANS.pending = storedQueueSids().reduce((n, sid) => n + (store.get('queue.' + sid) || []).length, 0);
  }
}
function beaconQueue(){
  const url = endpoint();
  if (!url || !state.queue.length || !state.study.consented || !navigator.sendBeacon) return;
  try { navigator.sendBeacon(url, new Blob([JSON.stringify(buildPayload(state.queue.slice(0, CONFIG.SYNC_BATCH_MAX)))], {type: 'text/plain;charset=utf-8'})); } catch(e){}
}
setInterval(() => { flushQueue('interval'); drainOrphanQueues(); }, CONFIG.SYNC_INTERVAL_MS);
window.addEventListener('online', () => { SYNC.nextAt = 0; flushQueue('online'); drainOrphanQueues(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden'){ saveLogs(); beaconQueue(); } });

// Time on screen + scroll depth (0–100%), logged when leaving a screen.
function endScreenSession(){
  const s = state.screenSession;
  if (!s.screen || !s.enteredAt) return;
  log('screen_exit', {screenLeft: s.screen, durationMs: Date.now() - s.enteredAt, maxScrollPct: Math.round(s.maxScrollPct)});
  state.screenSession = {screen:null, enteredAt:null, maxScrollPct:0};
}
function startScreenSession(screen){ state.screenSession = {screen, enteredAt: Date.now(), maxScrollPct: 0}; trackScroll(); }
function trackScroll(){
  const el = document.getElementById('content');
  if (!el || !state.screenSession.screen) return;
  const scrollable = el.scrollHeight - el.clientHeight;
  const pct = scrollable > 0 ? (el.scrollTop / scrollable) * 100 : 100;
  state.screenSession.maxScrollPct = Math.max(state.screenSession.maxScrollPct, Math.min(100, pct));
}

/* ========================= SHOPPING PERSISTENCE ========================= */
function saveShop(){
  if (!state.session || state.study.withdrawn) return;   // shopping data of a withdrawn session is never written again
  store.set('shop.' + state.session.sessionId, {
    cart: state.cart, orders: state.orders, membership: state.membership, prefs: state.prefs,
    addressId: state.addressId, checkout: state.checkout, seenDP: state.seenDP, dealEndsAt: state.dealEndsAt, productViews: state.productViews, seenImp: state.seenImp,
    nag: state.nag, memberFees: state.memberFees,

}
function loadShop(){

function resetShop(){

  state.nag = newNagState(); state.memberFees = 0;

  state.reviewTranslated = {}; state.reviewSort = {};
}
function newNagState(){ return {shows: 0, declines: 0, escapes: 0, escapedUntil: null, viewsSinceShow: 0, gatePrompts: 0, joinedVia: null}; }
function prod(id){ return PRODUCTS.find(p => p.id === id); }
function cartCount(){ return state.cart.reduce((s, i) => s + i.qty, 0); }
function currentAddress(){ return ADDRESSES.find(a => a.id === state.addressId) || ADDRESSES[0]; }

/* Honest price breakdown. Shipping: ₩3,000 once per order if any item lacks free
   shipping, waived for members (or when the trial is ticked at checkout). */
function computeTotals(items, opts){
  let list = 0, sale = 0, paidShip = false;
  items.forEach(it => { const p = prod(it.id); if (!p) return; list += dispList(p) * it.qty; sale += p.price * it.qty; if (!p.f) paidShip = true; });
  const member = state.membership.active || !!(opts && opts.trial === true);
  const shipping = paidShip && !member ? SHIPPING_FEE : 0;
  const protection = opts && opts.protection ? PROTECTION_FEE : 0;
  const handling = items.length ? HANDLING_FEE : 0;
  return {list, discount: list - sale, sale, shipping, protection, handling, total: sale + shipping + protection + handling, memberShipWaived: paidShip && member};
}
// What membership saved on an order: waived shipping plus Fresh items cheaper than their regular alternative.
function memberSavings(items, totals){
  const ship = totals.memberShipWaived ? SHIPPING_FEE : 0;
  const fresh = items.reduce((s, it) => { const p = prod(it.id); if (!p || !p.alt) return s; const a = prod(p.alt.id); return s + Math.max(0, Math.round(a.price * p.alt.r) - p.price) * it.qty; }, 0);
  return {shipping: ship, fresh, total: ship + fresh};
}
// dripPricing: the handling fee is hidden in the cart and appears at checkout only after a short delay.
function showHandling(stage){
  if (!dp('dripPricing')) return true;
  return stage === 'checkout' && !!(state.checkout && state.checkout.feeRevealed);
}
function shownTotal(tot, stage){ return showHandling(stage) ? tot.total : tot.total - tot.handling; }
function newCheckout(source, items){
  // The trial offer is only shown to non-members, so it is only pre-selected for them.
  return {source, items, protection: dp('sneakIntoBasket'), trial: dp('forcedContinuity') && !state.membership.active && memberCfg('checkoutOffer') ? true : null, mkBox: false,
    feeRevealed: !dp('dripPricing'), touched: {}};
}
function dateLabel(d){
  const wk = {en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], ko:['일','월','화','수','목','금','토']}[state.lang][d.getDay()];
  return state.lang === 'ko' ? `${d.getMonth() + 1}/${d.getDate()}(${wk})` : `${wk} ${d.getMonth() + 1}/${d.getDate()}`;
}
function arrivalText(items){
  const allFast = items.every(it => (prod(it.id) || {}).fast);
  const d = new Date(); d.setDate(d.getDate() + (allFast ? 1 : 3));
  return allFast ? UI[state.lang].tomorrow(dateLabel(d)) : UI[state.lang].inDays(dateLabel(d));
}

/* ============================ STUDY FLOW ============================
   consent → task → shopping → debrief (optional review in store) → complete.
   Declining ends the session with nothing stored. */
const App = {};
const STUDY_SCREENS = ['consent', 'declined', 'assigning', 'task', 'debrief', 'complete'];
function studyScreenFor(phase){ return {consent:'consent', declined:'declined', assigning:'assigning', task:'task', debrief:'debrief', complete:'complete'}[phase] || null; }
function inStore(){ return state.study.phase === 'shopping' || state.study.phase === 'review'; }
function completionCode(){
  const h = hashStr(state.session.sessionId).toString(36).toUpperCase().padStart(7, '0').slice(0, 6);
  return `${CONFIG.COMPLETION_PREFIX}-${h}`;
}
App.consentCheck = function(){
  const a = document.getElementById('c-age'), b = document.getElementById('c-agree'), btn = document.getElementById('c-accept');
  if (btn) btn.disabled = !(a && a.checked && b && b.checked);
};
App.acceptConsent = function(){
  const a = document.getElementById('c-age'), b = document.getElementById('c-agree');
  if (!(a && a.checked && b && b.checked)) return;
  const pending = !state.session.condAssigned;
  state.study = {phase: pending ? 'assigning' : 'task', consented:true, consentAt:new Date().toISOString(), taskStartAt:null, taskEnd:null, withdrawn:false};
  persistSession(); saveShop(); saveStudy();
  log('consent_given', {consentVersion: CONFIG.CONSENT_VERSION, lang: state.lang});
  if (pending){ App.navigate('assigning', {}, {replace: true}); runAssignment(); return; }
  logSessionStart();
  App.navigate('task', {}, {replace: true});
};
function logSessionStart(){
  const s = state.session;
  log('session_start', Object.assign({
    assignedBy: s.assignedBy, invalidCondParam: s.invalidCondParam || null, design: CONFIG.DESIGN.id, cell: s.condAssigned,
  }, cellLevels(s.condAssigned), {
    userAgent: navigator.userAgent, viewport: {w: window.innerWidth, h: window.innerHeight},
    dpConfig: flagSnapshot(),
  }));
}
/* Assign a design cell after consent. Server mode asks the logging server, which keeps the
   cells balanced across all devices; the same session always gets the same cell back. If the
   server cannot be reached, a random cell is used and recorded as 'random_fallback'. */
let assigning = false, pageUnloading = false;
addEventListener('pagehide', () => { pageUnloading = true; });
addEventListener('pageshow', () => { pageUnloading = false; });
async function runAssignment(){
  if (assigning || state.study.phase !== 'assigning') return;
  assigning = true;
  const sid = state.session.sessionId, cells = CONFIG.ASSIGNABLE_CONDITIONS, url = endpoint(), t0 = Date.now();
  let cell = null, by = 'server', error = null;
  if (CONFIG.ASSIGNMENT === 'server' && url){
    try {
      const j = await postJSON(url, JSON.stringify({v: 1, action: 'assign', sessionId: sid, design: CONFIG.DESIGN.id, cells}), CONFIG.ASSIGN_TIMEOUT_MS);
      if (!cells.includes(j.cell)) throw new Error('server returned unknown cell ' + j.cell);
      cell = j.cell;
    } catch(e){ error = String((e && e.message) || e); }
  }
  // A request cut off because the page is closing or reloading is not a server failure: leave the
  // session unassigned, and the reloaded page asks again (the server returns the same cell).
  if (!cell && pageUnloading){ assigning = false; return; }
  if (!cell){ cell = cells[randomIndex(cells.length)]; by = CONFIG.ASSIGNMENT === 'server' && url ? 'random_fallback' : 'random'; }
  assigning = false;
  if (!state.session || state.session.sessionId !== sid) return;   // the researcher started a new session meanwhile
  Object.assign(state.session, {condAssigned: cell, cond: cell, assignedBy: by});
  state.flags = flagsForPreset(cell);
  resetShop();                     // pattern-dependent defaults (e.g. marketing emails) follow the cell
  state.study.phase = 'task';
  persistSession(); saveShop(); saveStudy();
  log('assignment', Object.assign({cell, assignedBy: by, design: CONFIG.DESIGN.id}, cellLevels(cell), {latencyMs: Date.now() - t0, error}));
  logSessionStart();
  if (state.screen === 'assigning') App.navigate('task', {}, {replace: true});
}

/* ============================ NAVIGATION ============================
   Uses the History API so the phone's own back button works like a real app.
   TODO(phase 3): exitIntent intercepts popstate when leaving the store. */
App.navigate = function(screen, params, opts){
  opts = opts || {};
  endScreenSession();
  state.screen = screen;
  state.params = params || {};
  state.modal = null;
  if (!opts.fromPop){
    if (opts.replace) history.replaceState({screen, params: state.params, depth: state.navDepth}, '');
    else { state.navDepth += 1; history.pushState({screen, params: state.params, depth: state.navDepth}, ''); }
  }
  log('navigate', {to: screen, params: state.params, via: opts.fromPop ? 'back_button' : (opts.via || 'tap')});
  render();
  document.getElementById('content').scrollTop = 0;
  startScreenSession(screen);
  if (screen === 'cart' && !opts.fromPop) maybeMembershipOffer('cart');
  if (screen === 'product' && !opts.fromPop){
    state.productViews += 1; state.nag.viewsSinceShow += 1; saveShop();
    maybeMembershipOffer('product');
    // naggingInstall: recurring popup on the 1st, 4th, 7th… product view.
    if (dp('naggingInstall') && state.study.phase === 'shopping' && state.productViews % 3 === 1){
      log('dark_pattern_impression', {pattern: 'naggingInstall', item: state.params.id, productView: state.productViews});
      openModal(t('installTitle'), t('installBody'), [
        {label: t('installNo'), kind: 'sec', run: () => { log('install_popup_dismiss', {choice: 'later'}); closeModal(); }},
        {label: t('installYes'), kind: 'primary', run: () => { log('install_popup_dismiss', {choice: 'install'}); closeModal(); showToast(t('installSent')); }},
      ]);
    }
  }
};
App.back = function(fallback){
  if (state.navDepth > 0) history.back();

};
window.addEventListener('popstate', e => {
  // Outside the store (consent, task, debrief, complete) the back button stays on the current screen.
  if (!inStore()){
    history.pushState({screen: state.screen, params: state.params, depth: 1, guard: true}, '');
    return;
  }
  // exitIntent: the first back press from cart or checkout is intercepted once per screen.
  if (dp('exitIntent') && state.study.phase === 'shopping' && ['cart', 'checkout'].includes(state.screen) && !state.exitShown[state.screen] && !state.modal &&
      (state.screen === 'checkout' || state.cart.length)){
    const here = state.screen;
    state.exitShown[here] = true;
    history.pushState({screen: here, params: state.params, depth: state.navDepth}, '');
    log('dark_pattern_impression', {pattern: 'exitIntent', item: here});
    openModal(t('exitTitle'), t('exitBody'), [
      {label: t('exitLeave'), kind: 'sec', run: () => { log('exit_popup_choice', {choice: 'leave', screen: here}); closeModal(); history.back(); }},
      {label: t('exitStay'), kind: 'primary', run: () => { log('exit_popup_choice', {choice: 'stay', screen: here}); closeModal(); }},
    ]);
    return;
  }
  const st = e.state;
  // History below the store holds the consent / task entries; the store never goes back into them.
  if (st && STUDY_SCREENS.includes(st.screen)){
    history.pushState({screen: state.screen, params: state.params, depth: state.navDepth}, '');
    return;
  }
  if (!st || !st.screen){ state.navDepth = 0; App.navigate('home', {}, {fromPop: true}); return; }
  state.navDepth = st.depth || 0;
  App.navigate(st.screen, st.params || {}, {fromPop: true});
});

/* ShopKR+ pop-up (membership designs). Everyone gets ONE offer at the first product view.
   #23 membershipNagging: after "Not now" it returns (every Nth product view, and when the cart
   opens), up to NAG.MAX_SHOWS in all; from the second showing it offers "Don't show again for
   7 days" (NAG.ESCAPE), which stops it. In the control group the first "Not now" is final. */
function maybeMembershipOffer(trigger){
  const n = state.nag, NAG = CONFIG.NAG;
  if (!memberCfg('firstOffer') || state.study.phase !== 'shopping' || state.membership.active || state.modal) return;
  if (n.escapedUntil && Date.now() < n.escapedUntil) return;
  if (n.shows >= NAG.MAX_SHOWS) return;
  let show = false;
  if (n.shows === 0) show = trigger === 'product';
  else if (dp('membershipNagging') && n.declines >= n.shows){   // only after the previous showing was declined
    show = (trigger === 'product' && n.viewsSinceShow >= NAG.EVERY_N_PRODUCT_VIEWS) || (trigger === 'cart' && NAG.ON_CART && n.viewsSinceShow >= 1);
  }
  if (!show) return;
  n.shows += 1; n.viewsSinceShow = 0;
  const k = n.shows, repeat = k > 1, escape = repeat && NAG.ESCAPE;
  saveShop();
  log('membership_offer_shown', {n: k, trigger, repeat, escapeOffered: escape});
  if (repeat) log('dark_pattern_impression', {pattern: 'membershipNagging', item: 'offer_' + k});
  const actions = [
    {label: t('nagLater'), kind: 'sec', run: () => { n.declines += 1; saveShop(); log('membership_offer_choice', {n: k, choice: 'not_now', trigger}); closeModal(); }},
    {label: t('nagJoin'), kind: 'primary', run: () => { log('membership_offer_choice', {n: k, choice: 'join', trigger}); closeModal(); App.joinMembership('offer_' + k); }},
  ];
  if (escape) actions.push({label: t('nagEscape'), kind: 'link', run: () => {
    n.declines += 1; n.escapes += 1; n.escapedUntil = Date.now() + NAG.ESCAPE_DAYS * 864e5; saveShop();
    log('membership_offer_choice', {n: k, choice: 'escape_7_days', trigger}); closeModal();
  }});
  openModal(t('nagTitle'), t('nagBody'), actions);
}

}

App.modalAction = function(i){ const a = state.modal && state.modal.actions[i]; if (a) a.run(); };
function renderModal(){
  const old = document.getElementById('modal'); if (old) old.remove();
  if (!state.modal) return;
  const m = state.modal, el = document.createElement('div');
  el.id = 'modal'; el.className = 'modal-overlay';
  el.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true"><div class="modal-title">${escapeHtml(m.title)}</div><div class="modal-body">${escapeHtml(m.body)}</div>

// loopingTimer: a 15-minute countdown that silently restarts when it reaches zero.
function dealRemaining(){
  const now = Date.now();
  if (!state.dealEndsAt){ state.dealEndsAt = now + 15 * 60000; saveShop(); }
  if (state.dealEndsAt <= now){ state.dealEndsAt = now + 15 * 60000; saveShop(); log('timer_reset', {pattern: 'loopingTimer'}); }
  const ms = state.dealEndsAt - now, m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function matchesQuery(p, q){
  if (!q) return true;
  const s = q.toLowerCase().trim();
  const hay = (p.name + ' ' + p.brand + ' ' + catName(p.cat)).toLowerCase();
  if (hay.includes(s)) return true;
  if (CATEGORIES.some(c => c.id === p.cat && (c.en.toLowerCase().includes(s) || c.ko.includes(q)))) return true;
  return Object.keys(EN_KO_BRIDGE).some(k => (s === k || (s.length >= 3 && (s.includes(k) || k.startsWith(s)))) && p.name.includes(EN_KO_BRIDGE[k]));
}
const SORTERS = {
  recommended: (a, b) => (b.rating * Math.log10(b.rc + 10)) - (a.rating * Math.log10(a.rc + 10)) || a.id - b.id,
  priceLow: (a, b) => a.price - b.price || a.id - b.id,
  priceHigh: (a, b) => b.price - a.price || a.id - b.id,
  rating: (a, b) => b.rating - a.rating || b.rc - a.rc,
  reviews: (a, b) => b.rc - a.rc,
};

  if (state.filters.free) list = list.filter(p => p.f || bypass(p));
  if (state.filters.fast) list = list.filter(p => p.fast || bypass(p));
  list = list.slice().sort(SORTERS[state.sortBy] || SORTERS.recommended);
  if (dp('sortPinning')) list = [...list.filter(p => p.ad), ...list.filter(p => !p.ad)];   // sponsored pinned on top
  return list;
}

/* Dark-pattern impressions: the first time an element marked data-dp is at least
   half visible on screen, log dark_pattern_impression once per pattern + item. */
let dpObserver = null;
function logOnce(id, pattern, item){
  if (state.seenDP[id]) return;
  state.seenDP[id] = true; saveShop();
  log('dark_pattern_impression', {pattern, item: item == null ? null : String(item)});
}
function observeDP(){
  if (!('IntersectionObserver' in window)) return;
  if (!dpObserver) dpObserver = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target; dpObserver.unobserve(el);
    (el.dataset.dp || '').split(' ').filter(Boolean).forEach(key => { if (dp(key)) logOnce(key + ':' + (el.dataset.dpItem || ''), key, el.dataset.dpItem || null); });
  }), {threshold: 0.5});
  document.querySelectorAll('[data-dp]').forEach(el => dpObserver.observe(el));
  observeImpressions();
}
/* Viewport impressions: a product card or review counts as seen when at least half of it
   is on screen. Logged once per list context (screen + query/sort/filters) and position. */
let impObserver = null;
function observeImpressions(){
  if (!('IntersectionObserver' in window) || !state.study.consented) return;
  if (!impObserver) impObserver = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target; impObserver.unobserve(el);
    if (el.dataset.imp){
      const key = 'p|' + el.dataset.imp + '|' + el.dataset.impPid;
      if (state.seenImp[key]) return;
      state.seenImp[key] = 1; saveShop();
      const pr = prod(Number(el.dataset.impPid)) || {};
      log('product_impression', {productId: Number(el.dataset.impPid), list: el.dataset.imp, rank: Number(el.dataset.impRank), sponsored: !!pr.ad, price: pr.price});
    } else if (el.dataset.rimp){
      const key = 'r|' + el.dataset.rimp;
      if (state.seenImp[key]) return;
      state.seenImp[key] = 1; saveShop();
      const [pid, idx, sort] = el.dataset.rimp.split(':');
      log('review_impression', {productId: Number(pid), reviewIdx: Number(idx), sort, rank: Number(el.dataset.rrank), stars: Number(el.dataset.rstars)});
    }
  }), {threshold: 0.5});
  document.querySelectorAll('[data-imp], [data-rimp]').forEach(el => impObserver.observe(el));
}

/* Exports: JSON (full fidelity), wide CSV (one row per event), long CSV (one row per field). */
function flattenEntry(obj, prefix, out){
  Object.keys(obj).forEach(k => {
    const v = obj[k], col = prefix ? prefix + '.' + k : k;
    if (v !== null && typeof v === 'object' && !Array.isArray(v)) flattenEntry(v, col, out);
    else out[col] = Array.isArray(v) ? JSON.stringify(v) : v;
  });
}
function csvEscape(v){
  if (v === undefined || v === null) return '';
  let s = String(v);
  if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;   // formula-injection guard (text only; numbers stay numeric)
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function download(name, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportName(ext){
  const s = state.session; const tag = s.pid ? s.pid : s.sessionId.slice(0, 8);
  return `shopkr-log-${tag}-${s.condAssigned}-${Date.now()}.${ext}`;
}

  download(exportName('json'), JSON.stringify({session: state.session, events: state.logs}, null, 2), 'application/json');
};
App.exportCSV = function(){
  const rows = state.logs.map(e => { const o = {}; flattenEntry(e, '', o); return o; });
  const set = new Set(); rows.forEach(r => Object.keys(r).forEach(k => set.add(k)));
  const core = ['seq','t','iso','elapsedMs','sessionId','pid','cond','appVersion','screen','phase','type'];
  const dpCols = PATTERN_KEYS.map(k => 'detail.dpConfig.' + k).filter(c => set.has(c));
  const rest = [...set].filter(c => !core.includes(c) && !dpCols.includes(c)).sort();
  const cols = [...core, ...dpCols, ...rest];
  const lines = [cols.map(csvEscape).join(',')].concat(rows.map(r => cols.map(c => csvEscape(r[c])).join(',')));
  download(exportName('csv'), '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
};
App.exportCSVLong = function(){
  const core = ['seq','t','iso','elapsedMs','sessionId','pid','cond','appVersion','screen','phase','type'];
  const lines = [[...core, 'field', 'value'].map(csvEscape).join(',')];
  state.logs.forEach(e => {
    const flat = {}; flattenEntry(e, '', flat);
    const ctx = core.map(c => flat[c]);
    const fields = Object.keys(flat).filter(c => !core.includes(c)).sort();
    if (!fields.length) lines.push([...ctx, '', ''].map(csvEscape).join(','));
    fields.forEach(f => lines.push([...ctx, f.startsWith('detail.') ? f.slice(7) : f, flat[f]].map(csvEscape).join(',')));
  });
  download(exportName('long.csv'), '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
};

function renderResearcherPanel(){
  const el = document.getElementById('rp');
  const s = state.session;
  const tabs = [['session','Session'], ['patterns','Patterns'], ['log','Log'], ['changelog','Changelog']];
  let body = '';
  if (state.rpTab === 'session'){
    body = `
      <dl class="rp-kv">
        <dt>Participant ID</dt><dd>${s.pid ? escapeHtml(s.pid) : '<em style="color:var(--text-3)">not set</em>'}</dd>
        <dt>Design</dt><dd>${escapeHtml(CONFIG.DESIGN.id)}<br><span style="font-weight:500;color:var(--text-2)">${CONFIG.DESIGN.factors.map((f, i) => `${'ABCDEFGH'.charAt(i)} = ${escapeHtml(f.label)}${s.condAssigned && DESIGN_CELLS[s.condAssigned] ? ` (${DESIGN_CELLS[s.condAssigned].levels[f.key] ? 'on' : 'off'})` : ''}`).join(' · ')}</span></dd>
        <dt>Condition</dt><dd>${s.condAssigned ? escapeHtml(s.condAssigned) : '<em style="color:var(--text-3)">assigned after consent</em>'}${s.cond !== s.condAssigned ? ` → now <span style="color:var(--red)">${escapeHtml(s.cond)}</span>` : ''} <span style="color:var(--text-3);font-weight:500">(${s.assignedBy})</span></dd>
        <dt>Study step</dt><dd>${escapeHtml(state.study.phase)}${state.study.withdrawn ? ' <span style="color:var(--red)">(withdrawn)</span>' : ''}</dd>
        <dt>Active patterns</dt><dd>${activeKeys().length}/${PATTERN_KEYS.length}</dd>
        <dt>Session ID</dt><dd>${escapeHtml(s.sessionId)}</dd>
        <dt>Started</dt><dd>${escapeHtml(new Date(s.startedAt).toLocaleString())}</dd>
        <dt>Events</dt><dd>${state.logs.length}${!state.study.consented ? ' <span style="color:var(--text-3)">(nothing recorded before consent)</span>' : ''}</dd>
        <dt>Server</dt><dd>${endpoint() ? `<span style="color:var(--green)">on</span> <span style="font-weight:500;color:var(--text-3)">${escapeHtml(endpoint().replace(/^https?:\/\//, '').slice(0, 38))}…</span>` : '<span style="color:var(--text-3)">not set (data stays on this device)</span>'}</dd>
        <dt>Waiting to send</dt><dd>${state.queue.length}${SYNC.inFlight ? ' · sending…' : ''}${ORPHANS.pending ? ` <span style="color:var(--text-3);font-weight:500">+ ${ORPHANS.pending} from earlier sessions</span>` : ''}</dd>
        <dt>Last sent</dt><dd>${SYNC.lastOkAt ? escapeHtml(new Date(SYNC.lastOkAt).toLocaleTimeString()) : '—'}${SYNC.lastError ? `<br><span style="color:var(--red);font-weight:600">Error: ${escapeHtml(SYNC.lastError)} (retry ${escapeHtml(new Date(SYNC.nextAt).toLocaleTimeString())})</span>` : ''}</dd>
      </dl>
      <div class="rp-btns"><button class="rp-btn sec" onclick="App.setPid()">Set participant ID</button><button class="rp-btn danger" onclick="App.resetSession()">New session</button></div>
      ${state.study.phase === 'shopping' ? `<div class="rp-btns"><button class="rp-btn sec" onclick="App.openPanel(false); App.endTask('researcher_ended')">End task → debrief</button></div>` : ''}
      <div class="rp-btns"><button class="rp-btn sec" onclick="App.syncNow()">Send now</button><button class="rp-btn sec" onclick="App.testServer()">Test server</button><button class="rp-btn sec" onclick="App.setDeviceEndpoint()">Set server URL (this device)</button></div>
      <div class="rp-btns"><button class="rp-btn" onclick="App.exportJSON()">Export JSON</button><button class="rp-btn" onclick="App.exportCSV()">Export CSV</button></div>
      <div class="rp-btns"><button class="rp-btn sec" onclick="App.exportCSVLong()">Export CSV (long)</button><button class="rp-btn sec" onclick="App.clearLog()">Clear log</button></div>
      <p class="rp-note">Links: <code>?pid=P017</code> is assigned one of ${CONFIG.ASSIGNABLE_CONDITIONS.map(escapeHtml).join(' / ')} after consent (${CONFIG.ASSIGNMENT === 'server' ? 'balanced by the server, random if it is unreachable' : 'random on this device'}); <code>?pid=P017&amp;cond=A1B0</code> pins a condition. A refresh resumes this session; a link with a different pid or cond starts a new one.</p>`;
  } else if (state.rpTab === 'patterns'){
    const stageOrder = Object.keys(STAGES);
    body = `
      <div style="margin-bottom:8px"><b>Preset</b> <span class="rp-count">${activeKeys().length}/${PATTERN_KEYS.length} on</span></div>
      <div class="rp-presets">${Object.keys(CONFIG.PRESETS).map(code => `<button class="rp-preset ${s.cond === code ? 'active' : ''}" onclick="App.applyPreset('${code}')">${escapeHtml(code)} · ${(CONFIG.PRESETS[code] || []).length}</button>`).join('')}</div>
      <p class="rp-note">Each switch changes only its own element; the grey line under each name says where to see it. Defaults the participant has not touched follow switch changes. ★ = regulated under Korea's amended E-Commerce Act.</p>
      ${stageOrder.map(st => {
        const items = PATTERNS.filter(p => p.stage === st);
        if (!items.length) return '';
        return `<div class="rp-stage">${STAGES[st].en}</div>` + items.map(p => `
          <div class="rp-pat ${state.flags[p.key] ? 'on' : ''}">
            <span class="n">${p.n}</span>
            <span class="txt"><span class="nm" style="display:block">${escapeHtml(p.name.en)}${p.regulated ? ' ★' : ''}</span><span class="where" style="display:block">${escapeHtml(PATTERN_WHERE[p.key] || '')}</span><span class="sub" style="display:block">${escapeHtml(p.grayType)} · KFTC: ${escapeHtml(p.kftcType)}</span></span>
            <label class="switch"><input type="checkbox" aria-label="${escapeHtml(p.name.en)}" ${state.flags[p.key] ? 'checked' : ''} onchange="App.togglePattern('${p.key}')"><span class="track"></span></label>
          </div>`).join('');
      }).join('')}
      <div class="rp-stage">Preset matrix</div>
      <table class="rp-matrix"><tr><th>#</th>${Object.keys(CONFIG.PRESETS).map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr>
        ${PATTERNS.map(p => `<tr><td class="l">${p.n}</td>${Object.keys(CONFIG.PRESETS).map(c => `<td>${(CONFIG.PRESETS[c] || []).includes(p.key) ? '●' : ''}</td>`).join('')}</tr>`).join('')}
      </table>`;
  } else if (state.rpTab === 'log'){
    body = state.logs.length ? [...state.logs].reverse().slice(0, 200).map(e => `
      <div class="rp-log-item"><b>#${e.seq} ${escapeHtml(e.type)}</b> · ${escapeHtml(new Date(e.t).toLocaleTimeString())} · ${escapeHtml(e.screen)}<br>${escapeHtml(JSON.stringify(e.detail))}</div>`).join('')
      : '<p class="rp-note">No events yet.</p>';
  } else {
    body = CHANGELOG.map(c => `<div class="rp-cl"><h4>v${c.version}<span>${c.date}</span></h4><ul>${c.notes.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul></div>`).join('');
  }
  el.innerHTML = `
    <div class="rp-head"><h3>Researcher panel<span class="ver">v${CONFIG.APP_VERSION}</span></h3><button class="rp-close" aria-label="Close" onclick="App.openPanel(false)">✕</button></div>
    <div class="rp-tabs">${tabs.map(([k, l]) => `<button class="rp-tab ${state.rpTab === k ? 'active' : ''}" onclick="App.rpTab('${k}')">${l}</button>`).join('')}</div>
    <div class="rp-body">${body}</div>`;
}

/* ============================== STARTUP ============================== */
initSession();
document.getElementById('lang-btn').addEventListener('click', App.toggleLang);
document.getElementById('search-bar').addEventListener('click', () => App.navigate('search'));
document.getElementById('search-bar').addEventListener('keydown', e => { if (e.key === 'Enter') App.navigate('search'); });
document.getElementById('content').addEventListener('scroll', trackScroll, {passive: true});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.rpOpen) App.openPanel(false); });
window.addEventListener('pagehide', () => { endScreenSession(); saveLogs(); saveShop(); beaconQueue(); });
setTimeout(() => { flushQueue('startup'); drainOrphanQueues(); }, 800);   // resume sending anything left from before a refresh or by an earlier session
setupResearcherGesture();
// Restore the screen on refresh (history entry survives a reload); otherwise start at home.
(function initHistory(){
  const fixed = studyScreenFor(state.study.phase);
  if (fixed){   // consent, task, debrief, complete: always shown regardless of history
    state.screen = fixed; state.params = {}; state.navDepth = 0;
    history.replaceState({screen: fixed, params: {}, depth: 0}, '');
    return;
  }
  const st = history.state;
  if (st && st.screen && SCREENS[st.screen] && !STUDY_SCREENS.includes(st.screen)){ state.screen = st.screen; state.params = st.params || {}; state.navDepth = st.depth || 0; }
  else { state.screen = 'home'; history.replaceState({screen: 'home', params: {}, depth: 0}, ''); }
  state.reveal = state.study.phase === 'review';
})();
render();
startScreenSession(state.screen);
// A refresh during assignment asks again once the page has loaded (the same cell comes back).
if (state.study.phase === 'assigning'){
  if (document.readyState === 'complete') setTimeout(runAssignment, 0);
  else window.addEventListener('load', () => setTimeout(runAssignment, 0), {once: true});
}
</script>
